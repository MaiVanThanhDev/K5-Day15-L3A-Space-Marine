# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)
# Bài: trợ lý trả lời hạn nộp lab / phòng học buổi tới cho học viên L3 (spec.md §4).
# CHỜ: số lần dùng của persona thay bằng số khảo sát (evidence/survey) khi có — hiện là (tự ước tính).

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # học viên lớp L3 khoá AI20K K5 dùng trợ lý trên Discord
  low: 300
  base: 700
  high: 1000
  source: "base: lớp L3 hơn 700 học viên theo README hackathon (repo đề) — cần đối chiếu lại. low 300: chỉ ~40% học viên hỏi qua trợ lý (tự ước tính). high 1000: mở thêm cho lớp khác dùng chung kênh (tự ước tính)"

personas:           # chia theo mức hỏi hạn nộp / phòng học; share cộng lại = 1
  - name: hoi_it            # chỉ hỏi khi sắp đến hạn lab lớn
    share: 0.5
    uses_per_month: 2
    turns_per_session: 1
    source: "(tự ước tính) — thay bằng khảo sát: số lần tra hạn / phòng mỗi tuần"
  - name: hoi_moi_tuan      # hỏi hạn lab của tuần + phòng buổi tới
    share: 0.35
    uses_per_month: 4
    turns_per_session: 2
    source: "(tự ước tính) — thay bằng khảo sát: số lần tra hạn / phòng mỗi tuần"
  - name: hoi_truoc_moi_buoi # hỏi phòng trước hầu hết các buổi học, hỏi lại khi có thông báo đổi
    share: 0.15
    uses_per_month: 8
    turns_per_session: 3
    source: "(tự ước tính) — thay bằng khảo sát + đếm tin hỏi lặp trên Discord (evidence/data-mining.md)"
# Mỗi lượt hỏi lấy ngẫu nhiên một đầu vào trong eval/benchmark.csv (type thuong và kho).
# Persona hỏi kiểu riêng: thêm vào persona đó
#     types: [thuong, kho, tu_choi]
# hoặc
#     inputs: ["câu hỏi kiểu 1", "câu hỏi kiểu 2"]

prices:             # USD / 1 triệu token, gói trả phí Standard (giá ra đã gồm token suy nghĩ). ≥2 mức model
                    # Tên model phải khớp MODEL_NAME bản chạy thử dùng để khung ghép token đo thật với giá.
  - model: gemini-3.1-flash-lite
    input: 0.25
    output: 1.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 27/11/2026 · mức rẻ"
  - model: gemini-3.6-flash
    input: 1.50
    output: 7.50
    source: "https://ai.google.dev/gemini-api/docs/pricing · xem 27/11/2026 · mức mạnh · giá gốc từ 01/01/2027 (đến 31/12/2026 đang khuyến mãi 0.75 / 3.75) — dùng giá gốc vì tính chi phí dùng lâu dài"

usd_to_vnd:         # tuỳ chọn: điền thì bản tóm tắt in thêm tiền Việt
  rate:
  source:
